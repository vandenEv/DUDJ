<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Box Cam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Hide text that will type out, so it doesn't flash before the main script loads.
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("type-pending");
      }
    </script>
  </head>
  <body>
    <div id="cam" class="cam" hidden>
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <main class="stage">
      <section id="intro" class="box">
        <p data-type>Turn on your camera to continue.</p>
        <button id="enable" class="btn" type="button">Enable camera</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section id="question" class="box" hidden>
        <p class="question-text" data-type>Welcome to the<br />DUDJ Trainer<br /><span class="accent">Enter?</span></p>
        <div class="answers">
          <button id="answer-yes" class="btn" type="button">Ja!</button>
          <button id="answer-no" class="btn" type="button">No.</button>
        </div>
      </section>

      <section id="trainer" class="trainer" hidden>
        <div class="screen">
          <p id="answer-now" class="answer-now" hidden>Answer now</p>
          <div id="loading" class="loading" aria-hidden="true" hidden>
            <span style="--i: 0"></span><span style="--i: 1"></span><span style="--i: 2"></span><span style="--i: 3"></span>
            <span style="--i: 4"></span><span style="--i: 5"></span><span style="--i: 6"></span><span style="--i: 7"></span>
          </div>
          <div id="break" class="break" hidden>
            <div class="loading" aria-hidden="true">
              <span style="--i: 0"></span><span style="--i: 1"></span><span style="--i: 2"></span><span style="--i: 3"></span>
              <span style="--i: 4"></span><span style="--i: 5"></span><span style="--i: 6"></span><span style="--i: 7"></span>
            </div>
            <p class="break-text">Loading</p>
          </div>
        </div>
        <p id="timing" class="timing" hidden></p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
